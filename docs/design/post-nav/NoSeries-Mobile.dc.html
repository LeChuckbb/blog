<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --background: oklch(0.982 0.005 95);
      --foreground: oklch(0.245 0.006 286);
      --primary: oklch(0.59 0.20 277);
      --muted: oklch(0.955 0.005 95);
      --muted-40: oklch(0.955 0.005 95 / 40%);
      --muted-foreground: oklch(0.571 0.006 107);
      --border: oklch(0.913 0.007 89);
      --accent: oklch(0.94 0.04 277);
    }
    .dark {
      --background: oklch(0.228 0.008 286);
      --foreground: oklch(0.942 0.005 107);
      --primary: oklch(0.72 0.18 277);
      --muted: oklch(0.320 0.011 286);
      --muted-40: oklch(0.320 0.011 286 / 20%);
      --muted-foreground: oklch(0.705 0.006 107);
      --border: oklch(1 0 0 / 10%);
      --accent: oklch(0.22 0.06 277);
    }
    body { margin: 0; }
    .page {
      font-family: "Asta Sans Variable", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      letter-spacing: -0.01em; word-break: keep-all; line-height: 1.75;
      background: var(--background); color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: "MaruBuri", "Apple SD Gothic Neo", serif; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary); }
    .row:hover { background: var(--muted); }
    .card:hover { background: var(--muted); }
    .row:hover .t, .card:hover .t, .cell:hover .t { text-decoration: underline; text-underline-offset: 3px; }
    .prose p { margin: 0; font-size: 1.0625rem; line-height: 1.75; }
    .prose hr { border: 0; border-top: 1px solid var(--border); margin: 3em 0; }
  </style>
</helmet>
<div class="page {{themeClass}}" style="position: relative; width: 390px; min-height: 640px; box-sizing: border-box; padding: 24px 16px 96px;">
  <article style="max-width: 680px; margin: 0 auto; min-width: 0;">
    
<div class="prose">
  <p>에러 설계에 있어 중요한 지점은 에러 객체 구조를 짜는 게 아니라 에러의 흐름을 통제하는 것이다. Server side/Client side에서 에러가 발생할 때, 그리고 Server Action, RSC, proxy, useQuery, useMutation과 같은 다양한 상황에서 발생하는 에러가 어디에서 어떻게 처리되는지. 이 핵심 부분은 별도 글에서 이어가보겠다.</p>
</div>
    
<nav aria-label="이전 글 / 다음 글" style="margin-top: 64px; display: flex; flex-direction: column; gap: 12px;">
  
  
  <div style="display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 12px;">
    
  <a href="#" class="card" style="display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--muted-40); ">
    <span style="display: flex; flex-shrink: 0; color: var(--muted-foreground);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <span style="font-size: 0.75rem; color: var(--muted-foreground); line-height: 1.25;">이전 글</span>
      <span class="t" style="font-size: 0.875rem; font-weight: 600; color: var(--foreground); line-height: 1.45;">Next.js URL Search Params 꼭 써보세요</span>
    </span>
  </a>
  <a href="#" class="card" style="display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--muted-40); flex-direction: row-reverse; text-align: right;">
    <span style="display: flex; flex-shrink: 0; color: var(--muted-foreground);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <span style="font-size: 0.75rem; color: var(--muted-foreground); line-height: 1.25;">다음 글</span>
      <span class="t" style="font-size: 0.875rem; font-weight: 600; color: var(--foreground); line-height: 1.45;">원티드 하이파이브 2026 후기 - AI 시대에서 살아남기</span>
    </span>
  </a>
  </div>
</nav>
  </article>
  
<div style="position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 0.875rem; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg><span>마치며</span></div>
<div style="position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--primary); box-sizing: border-box;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? "dark" : "" };
  }
}
</script>
</body>
</html>
